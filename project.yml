name: HackerTube
options:
  bundleIdPrefix: org.hackertube
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HackerTube:
    type: application
    platform: iOS
    sources:
      - path: HackerTube
    info:
      path: HackerTube/Info.plist
      properties:
        CFBundleDisplayName: HackerTube
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hackertube.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  HackerTubeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HackerTubeUITests
    dependencies:
      - target: HackerTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hackertube.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HackerTube
schemes:
  HackerTube:
    build:
      targets:
        HackerTube: all
        HackerTubeUITests: [test]
    test:
      targets:
        - HackerTubeUITests
